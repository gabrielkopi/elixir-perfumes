# ELIXIR · API híbrida — arquivo NOVO e isolado (não edita outros sites).
# Troque api.SEU-DOMINIO pelo subdomínio escolhido. HTTPS via certbot (veja deploy/README.md).
server {
    listen 80;
    server_name api.SEU-DOMINIO;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.SEU-DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/api.SEU-DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.SEU-DOMINIO/privkey.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
