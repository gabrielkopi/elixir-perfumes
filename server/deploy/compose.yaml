# ELIXIR · API híbrida. Uso: docker compose --env-file .env up -d --build
# Isolado: rede própria, volume próprio, porta só em 127.0.0.1 (o Nginx do servidor faz HTTPS).
name: elixir-api
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elixir
      POSTGRES_USER: elixir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - elixir-db:/var/lib/postgresql/data
    networks: [elixir]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elixir -d elixir"]
      interval: 10s
      retries: 5
  api:
    build: ..
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://elixir:${POSTGRES_PASSWORD}@db:5432/elixir
      CORS_ORIGINS: ${CORS_ORIGINS:-https://gabrielkopi.github.io}
      PORT: 8787
    ports:
      - "127.0.0.1:${API_PORT:-8787}:8787"
    networks: [elixir]
volumes:
  elixir-db:
networks:
  elixir:
